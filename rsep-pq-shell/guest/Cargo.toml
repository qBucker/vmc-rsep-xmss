[package]
name = "rsep-guest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["heap-embedded-alloc"] }
ark-ff = { version = "0.4", default-features = false }
ark-bn254 = { version = "0.4", default-features = false, features = ["scalar_field"] }
blake2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
