[package]
name = "rsep-pq-host"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["prove", "disable-dev-mode"] }
risc0-binfmt = "=3.0.5"
risc0-zkos-v1compat = "=2.2.3"
ark-ff = { version = "0.4", default-features = false }
ark-bn254 = { version = "0.4", default-features = false, features = ["scalar_field"] }
blake2 = { version = "0.10", default-features = false }
bincode = "1.3"

[profile.release]
opt-level = 3

# 沙盒工程：vendor 两个 C++ 巨兽 sys crate（rv32im 7 个 cpp 含 4 个 3-4MB 生成代码、
# recursion 8 个），将其 build.rs 替换为 .o 持久缓存版（-O0），原 -O3 串行/并行编译
# 在随机回收窗口内永不收敛。vendor 目录由 recover.sh 每周期从 registry .crate 重建，
# 仅 build.rs 不同，源码与版本不变。披露：-O0 内核使 prove 墙钟为保守上界。
[patch.crates-io]
risc0-circuit-keccak-sys = { path = "../vendor/risc0-circuit-keccak-sys" }
risc0-circuit-rv32im-sys = { path = "../vendor/risc0-circuit-rv32im-sys" }
risc0-circuit-recursion-sys = { path = "../vendor/risc0-circuit-recursion-sys" }
