[package]
name = "rsep-xmss"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Verifiable Monotone Chains instantiated as RSEP-XMSS"
repository = "https://example.invalid/rsep-xmss"
readme = "README.md"

[dependencies]
ark-ff = { version = "0.4", default-features = false }
ark-ec = { version = "0.4", default-features = false }
ark-bn254 = { version = "0.4", default-features = false, features = ["curve"] }
ark-groth16 = { version = "0.4", default-features = false }
ark-relations = { version = "0.4", default-features = false }
ark-serialize = { version = "0.4", default-features = false }
ark-std = { version = "0.4", default-features = false }
blake2 = { version = "0.10", default-features = false }
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
thiserror = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"

[features]
default = ["std"]
std = [
    "ark-ff/std",
    "ark-ec/std",
    "ark-bn254/std",
    "ark-groth16/std",
    "ark-relations/std",
    "ark-serialize/std",
    "ark-std/std",
    "blake2/std",
    "rand/std",
    "rand_chacha/std",
]

[dev-dependencies]
hex = "0.4"
hex-literal = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
# E1: SLH-DSA (SPHINCS+) reference-C comparison baseline for the paper's Table 2
pqcrypto-sphincsplus = "0.7.2"
# E3: 2-of-3 governance quorum mock (SEAL) for the agent-trail simulation
ed25519-dalek = "2"

[[bench]]
name = "rsep"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
